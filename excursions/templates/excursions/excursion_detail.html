{% extends "base_generic.html" %}

{% block content %}
  <style>
    .excursion-detail-card {
      background-color: #fdfdfd;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 800px;
      margin: 0 auto;
      text-align: left;
    }

    .excursion-detail-title {
      font-size: 28px;
      margin-bottom: 20px;
      color: #2c6b45;
    }

    .excursion-detail-image {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .excursion-detail-text {
      font-size: 18px;
      margin-bottom: 10px;
      color: #333;
    }

    .excursion-detail-buttons {
      margin-top: 20px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .details-button {
      display: inline-block;
      padding: 10px 18px;
      background-color: #2c6b45;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 16px;
    }

    .details-button:hover {
      background-color: #a1e8a7;
      color: #2c6b45;
    }

    .back-link {
      display: inline-block;
      padding: 10px 18px;
      background-color: #ccc;
      color: #333;
      text-decoration: none;
      border-radius: 5px;
      font-size: 16px;
    }

    .back-link:hover {
      background-color: #bbb;
    }
  </style>

  <div class="container">
    <div class="excursion-detail-card">
      <h1 class="excursion-detail-title">{{ excursion.title }}</h1>
      <img src="{{ excursion.image.url }}" alt="{{ excursion.title }}" class="excursion-detail-image">
      <p class="excursion-detail-text"><strong>Цена:</strong> ${{ excursion.price }}</p>
      <p class="excursion-detail-text"><strong>Дата:</strong> {{ excursion.date }}</p>
      <p class="excursion-detail-text"><strong>Продолжительность:</strong> {{ excursion.duration }}</p>
      <p class="excursion-detail-text">{{ excursion.description }}</p>

      <div class="excursion-detail-buttons">
        <a href="{% url 'orders:order_create' excursion.id %}" class="details-button">Купить экскурсию</a>
        <a href="{% url 'excursions:excursion_list' %}" class="back-link">Назад к списку</a>
      </div>
    </div>
  </div>
{% endblock %}
