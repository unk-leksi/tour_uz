{% extends "base_generic.html" %}

{% block content %}
  <h1>{% if form.instance.pk %}Edit{% else %}Create{% endif %} Excursion</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if form.instance.pk %}Save{% else %}Create{% endif %}</button>
  </form>
  <a href="{% url 'excursions:excursion_list' %}">Back to list</a>
{% endblock %}
