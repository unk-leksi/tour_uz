{% extends "base_generic.html" %}

{% block content %}
  <div class="container">
    <h1>Мои заказы</h1>

    <ul>
      {% for order in orders %}
        <li>
          Экскурсия: {{ order.excursion.title }} <br>
          Статус: {{ order.status }} <br>
          Цена: ${{ order.price }} <br>
          Дата создания: {{ order.created_at }} <br>
        </li>
      {% endfor %}
    </ul>
  </div>
{% endblock %}
